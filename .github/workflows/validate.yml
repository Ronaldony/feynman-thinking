name: Validate feynman-thinking

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill package and mirror
        run: python scripts/validate_skill.py

      - name: Compile evaluation tools
        run: python -m py_compile scripts/*.py skills/feynman-thinking/scripts/*.py

      - name: Assemble evaluation prompts
        run: |
          python scripts/run_eval.py --condition all --dry-run > /tmp/eval-prompts.jsonl
          test "$(wc -l < /tmp/eval-prompts.jsonl)" -ge 40
