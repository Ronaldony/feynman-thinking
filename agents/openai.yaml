interface:
  display_name: "리처드 파인만 사고법"
  short_description: "재표현·직접 작업·판별 검증·수정으로 추론하는 스킬"
  default_prompt: "이 문제를 리처드 파인만의 연구 행동에서 도출한 방식으로 수행해 주세요. 먼저 이름을 벗겨 실제 현상과 성공 기준으로 재표현하고, 독립적인 작동 모델과 대안 표현을 만든 뒤, 가능한 계산·추정·자료 확인·테스트를 실제로 수행하세요. 경쟁 설명을 구별할 검사를 고르고 불리한 결과에 따라 모델·범위·확신을 수정한 후, 쉬운 설명과 정밀한 근거가 일치하도록 결과를 작성하세요."
policy:
  allow_implicit_invocation: true
